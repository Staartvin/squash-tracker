<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squash Crew</title>
  <meta name="description" content="Squash scores, leaderboard and subscription break-even tracker.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%230b0b0b'/%3E%3Ccircle cx='12.5' cy='16' r='2' fill='%23eda100'/%3E%3Ccircle cx='19.5' cy='16' r='2' fill='%23eda100'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#dashboard" id="site-title">Squash Crew</a>
      <nav class="tabs" aria-label="Sections">
        <a href="#dashboard" data-view="dashboard">Dashboard</a>
        <a href="#players" data-view="players">Players</a>
        <a href="#recap" data-view="recap">Recap</a>
        <a href="#history" data-view="history">History</a>
        <a href="#log" data-view="log" class="tab-log">+ Log</a>
      </nav>
    </div>
  </header>
  <div id="banner"></div>
  <main id="app" class="wrap"></main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="wrap">This page needs JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
